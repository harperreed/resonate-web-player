version: '3.8'

services:
  resonate-player:
    build:
      context: .
      dockerfile: Dockerfile.simple
    container_name: resonate-player
    ports:
      - "8080:8080"
    volumes:
      # Mount config directory for easy configuration changes
      - ./config:/app/config:ro

      # Audio Configuration Options (choose one):

      # Option 1: PulseAudio socket (recommended for most Linux systems)
      # Uncomment to share PulseAudio with the container
      - /run/user/${UID:-1000}/pulse:/run/user/1000/pulse:ro
      - ~/.config/pulse/cookie:/root/.config/pulse/cookie:ro

      # Option 2: Direct ALSA access
      # Use this if you're not using PulseAudio
      # - /dev/snd:/dev/snd

    environment:
      # Config path (can be overridden)
      - CONFIG_PATH=/app/config/config.yaml

      # PulseAudio environment variables
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
      - PULSE_COOKIE=/root/.config/pulse/cookie

    # Direct ALSA device access (Linux only)
    # Uncomment for direct hardware access
    devices:
      - /dev/snd:/dev/snd

    # Add container to audio group for device permissions
    group_add:
      - audio

    # Use host network mode for easier server access
    network_mode: host

    restart: unless-stopped

  # Alternative: ALSA-only configuration (uncomment to use)
  # resonate-player-alsa:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.simple
  #   container_name: resonate-player-alsa
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./config:/app/config:ro
  #   devices:
  #     - /dev/snd:/dev/snd
  #   group_add:
  #     - audio
  #   network_mode: host
  #   restart: unless-stopped
